<!DOCTYPE html>
<html lang="en">
{% load static %}
<script src="{% static 'jsDirectory/jquery-3.6.1.min.js' %}"></script>
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<script>
    function normalizeHexColor(colorValue) {
        if (!colorValue) {
            return '000000';
        }
        let color = colorValue.trim().toUpperCase();
        if (color[0] === '#') {
            color = color.slice(1);
        }
        if (/^[0-9A-F]{6}$/.test(color)) {
            return color;
        }
        let rgbMatch = colorValue.match(/\d+/g);
        if (rgbMatch && rgbMatch.length >= 3) {
            return rgbMatch.slice(0, 3).map(function (num) {
                return Number(num).toString(16).padStart(2, '0');
            }).join('').toUpperCase();
        }
        return '000000';
    }

    function serializeCaptionNode(node, currentColor) {
        if (node.nodeType === Node.TEXT_NODE) {
            if (!node.nodeValue) {
                return '';
            }
            if (currentColor === '000000') {
                return node.nodeValue;
            }
            return '^' + currentColor + node.nodeValue + '^000000';
        }

        if (node.nodeType !== Node.ELEMENT_NODE) {
            return '';
        }

        if (node.tagName === 'BR') {
            return '\n';
        }

        let nodeColor = currentColor;
        if (node.tagName === 'FONT' && node.getAttribute('color')) {
            nodeColor = normalizeHexColor(node.getAttribute('color'));
        } else if (node.style && node.style.color) {
            nodeColor = normalizeHexColor(node.style.color);
        }

        let text = '';
        for (let i = 0; i < node.childNodes.length; i++) {
            text += serializeCaptionNode(node.childNodes[i], nodeColor);
        }

        if (node.tagName === 'DIV' || node.tagName === 'P') {
            text += '\n';
        }
        return text;
    }
    function updateCaptionValue() {
        let editor = document.getElementById('captionEditor');
        let captionInput = document.getElementById('caption');
        let serializedText = '';
        for (let i = 0; i < editor.childNodes.length; i++) {
            serializedText += serializeCaptionNode(editor.childNodes[i], '000000');
        }
        serializedText = serializedText.replace(/\n+$/, '');
        captionInput.value = serializedText;
    }

    function applyCaptionColor() {
        let colorPicker = document.getElementById('captionColorPicker');
        let editor = document.getElementById('captionEditor');
        editor.focus();
        document.execCommand('styleWithCSS', false, true);
        document.execCommand('foreColor', false, colorPicker.value);
        updateCaptionValue();
    }

    function createItem() {
        updateCaptionValue();

        $.ajax({
            url: '/createitem/',
            type: 'post',
            data: {
                csrfmiddlewaretoken: $("[name='csrfmiddlewaretoken']").val(),
                item: $('[name="item"]').val(),
                name: $('[name="name"]').val(),
                act: $('[name="act"]').val(),
                caption: $('[name="caption"]').val(),
                card: $('[name="card"]').val(),
                view: $('[name=view]').val(),
                type: $('[name=type]').val(),
            },
            success: function (data) {
                data = JSON.parse(data);
                let status = data.status
                let itemShow = document.getElementById('itemShow');
                let viewShow = document.getElementById('viewShow');

                if (status == "新增成功") {
                    alert(status);
                    itemShow.innerHTML = "";
                    viewShow.innerHTML = "";
                    document.getElementById('captionEditor').innerHTML = '';
                    updateCaptionValue();
                } else if (status == "此物品編號已存在" || status == "請輸入完整物品資訊" || status == "item只可為數字") {
                    itemShow.innerHTML = status;
                } else if (status == "view只可為數字") {
                    viewShow.innerHTML = status;
                } else if (status == "請重新登入") {
                    var createTable = document.getElementById('createTable');
                    var reload = document.getElementById('reload');
                    createTable.style.visibility = "hidden"
                    reload.style.display = ""
                }
            }
        })
    }
    document.addEventListener('DOMContentLoaded', function () {
        updateCaptionValue();
    });
</script>
<body>
<div style="display: none" id="reload">
    <a>請重新登入</a>
</div>
<form action="" method="post" style="visibility: visible" id="createTable">
    {% csrf_token %}
    <table>
        <tr>
            <td>
                <a>物品編號</a>
            </td>
            <td>
                <input type="text" value="" id="item" name="item">
                <a id="itemShow" style="color: #ff0000"></a>
            </td>
        </tr>
        <tr>
            <td>
                <a>物品名稱</a>
            </td>
            <td>
                <input type="text" value="" id="name" name="name">
            </td>
        </tr>
        <tr>
            <td>
                <a>檔案對應名稱</a>
            </td>
            <td>
                <input value="" name="act" id="act">
            </td>
        </tr>
        <tr>
            <td>
                <a>說明</a>
            </td>
            <td>
                <input type="hidden" id="caption" name="caption">
                <div style="margin-bottom: 8px">
                    <input type="color" id="captionColorPicker" value="#000000">
                    <button type="button" onclick="applyCaptionColor()">套用顏色</button>
                </div>
                <div id="captionEditor" contenteditable="true"
                     style="width: 900px; height: 220px; border: 1px solid #cbcbcb; overflow-y: auto; padding: 6px"
                     oninput="updateCaptionValue()" onkeyup="updateCaptionValue()"></div>
            </td>

        </tr>
        <tr>
            <td>
                <a>洞數</a>
            </td>
            <td>
                <select id="card" name="card">
                    <option selected disabled hidden>請選擇洞數</option>
                    <option>0</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>
                <a>套用view</a>
            </td>
            <td>
                <input type="text" value="" id="view" name="view">
                <a id="viewShow" style="color: #ff0000"></a>
            </td>
        </tr>
        <tr>
            <td>
                <a>種類</a>
            </td>
            <td>
                <select id="type" name="type">
                    <option selected disabled hidden>請選擇種類</option>
                    <option>其他</option>
                    <option>披肩(有外觀)</option>
                    <option>卡片</option>
                    <option>頭飾</option>
                    <option>鑲嵌</option>
                </select>
            </td>
        </tr>
        <tr>
            <td colspan="2" style="text-align: center">
                <input type="button" name="create" id="create" value="資料上傳" onclick="createItem()">
            </td>
        </tr>
    </table>
</form>
</body>
</html>
